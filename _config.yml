# GitHub Pages build config.
#
# This site is hand-written static HTML — Jekyll is only here because Pages runs
# it by default. The sole purpose of this file is `exclude`: keeping project
# scaffolding (docs, build tooling, agent context) out of the published site.
# Without it, every committed non-dotfile is served at jamesreinlein.com/<path>.
#
# NOTE: setting `exclude` REPLACES Jekyll's default list rather than extending
# it, so the usual defaults (node_modules, vendor, Gemfile) are repeated below.

exclude:
  # Project scaffolding — in the repo, not part of the website
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - docs/
  - scripts/
  - package.json
  - package-lock.json

  # Jekyll defaults, restored
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
